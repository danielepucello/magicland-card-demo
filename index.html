<script>


function scaricaCard(){


html2canvas(document.querySelector("#downloadCard"))

.then(canvas=>{


let link=document.createElement("a");


link.download="Daniele_Pucello_MagicLand.png";


link.href=canvas.toDataURL();


link.click();


});


}



async function condividi(){


if(navigator.share){


await navigator.share({

title:"Daniele Pucello - MagicLand",

text:"Contatto digitale MagicLand",

url:window.location.href

});


}

else{

alert("Apri questa pagina dal telefono per condividere");

}


}
